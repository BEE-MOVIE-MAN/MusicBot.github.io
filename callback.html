<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token capturado</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1e1f22; color: #dbdee1; padding: 24px;
  }
  .caja {
    width: 100%; max-width: 640px; background: #2b2d31;
    border-radius: 16px; padding: 32px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p.sub { color: #949ba4; font-size: 14px; margin: 0 0 24px; }
  .perfil { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .perfil img { width: 56px; height: 56px; border-radius: 50%; }
  .perfil .nombre { font-weight: 700; font-size: 17px; }
  .perfil .id { color: #949ba4; font-size: 13px; }
  label { display: block; font-size: 12px; text-transform: uppercase;
          letter-spacing: .5px; color: #949ba4; margin-bottom: 8px; }
  textarea {
    width: 100%; height: 96px; resize: vertical;
    background: #1e1f22; color: #a5d6ff;
    border: 1px solid #3f4147; border-radius: 8px; padding: 12px;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
  }
  button {
    margin-top: 12px; width: 100%; padding: 12px;
    background: #5865f2; color: #fff; border: 0; border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #4752c4; }
  .estado { margin-top: 16px; font-size: 14px; color: #949ba4; }
  .error { color: #f23f43; }
</style>
</head>
<body>
  <div class="caja">
    <h1 id="titulo">Procesando...</h1>
    <p class="sub" id="subtitulo">Un momento, estamos capturando tu token.</p>

    <div class="perfil" id="perfil" style="display:none">
      <img id="avatar" src="" alt="">
      <div>
        <div class="nombre" id="nombre"></div>
        <div class="id" id="idusuario"></div>
      </div>
    </div>

    <div id="zonaToken" style="display:none">
      <label>Tu access token</label>
      <textarea id="token" readonly></textarea>
      <button id="copiar">Copiar token</button>
    </div>

    <div class="estado" id="estado"></div>
  </div>

<script>
  // Atajos a los elementos de la pagina
  const titulo = document.getElementById('titulo');
  const subtitulo = document.getElementById('subtitulo');
  const estado = document.getElementById('estado');
  const zonaToken = document.getElementById('zonaToken');
  const tokenBox = document.getElementById('token');
  const perfil = document.getElementById('perfil');

  // 1. Tomamos lo que viene DESPUES del simbolo # en la direccion
  //    Discord manda el token ahi. Ejemplo:
  //    https://tuweb/callback.html#access_token=ABC123&token_type=Bearer
  const params = new URLSearchParams(location.hash.slice(1));
  const token = params.get('access_token');
  const error = params.get('error');

  // 2. Si el usuario le dio a "Cancelar"
  if (error) {
    titulo.textContent = 'Cancelado';
    subtitulo.textContent = 'No autorizaste el acceso.';
    estado.textContent = 'Error: ' + error;
  }

  // 3. Si entro sin token (abrio la pagina directo)
  else if (!token) {
    titulo.textContent = 'Sin token';
    subtitulo.textContent = 'Abre esta pagina desde el enlace de autorizacion.';
  }

  // 4. Todo bien: mostramos el token
  else {
    titulo.textContent = 'Token capturado';
    subtitulo.textContent = 'Ya tenemos acceso a la cuenta.';
    tokenBox.value = token;
    zonaToken.style.display = 'block';

    // Lo guardamos en el almacenamiento de ESTA pagina
    localStorage.setItem('discord_token', token);
    localStorage.setItem('discord_token_fecha', new Date().toISOString());

    // Limpiamos el # de la barra de direcciones
    history.replaceState(null, '', location.pathname);

    // 5. Usamos el token para pedir los datos del usuario
    fetch('https://discord.com/api/users/@me', {
      headers: { Authorization: 'Bearer ' + token }
    })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(u => {
      perfil.style.display = 'flex';
      document.getElementById('nombre').textContent = u.global_name || u.username;
      document.getElementById('idusuario').textContent = 'ID: ' + u.id;
      if (u.avatar) {
        document.getElementById('avatar').src =
          'https://cdn.discordapp.com/avatars/' + u.id + '/' + u.avatar + '.png?size=128';
      }
    })
    .catch(e => {
      estado.textContent = 'No se pudieron cargar los datos: ' + e.message;
      estado.className = 'estado error';
    });
  }

  // 6. Boton para copiar el token
  document.getElementById('copiar').addEventListener('click', () => {
    navigator.clipboard.writeText(tokenBox.value);
    const b = document.getElementById('copiar');
    b.textContent = 'Copiado';
    setTimeout(() => b.textContent = 'Copiar token', 1500);
  });
</script>
</body>
</html>
